<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarks</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="">
    <h1>Add your bookmark site</h1>
    <div>
        <input type="text" name="" id="websiteTitle" placeholder="Type your bookmark title...">
        <input type="text" name="" id="websiteURL" placeholder="The bookmark URL">
        <input type="text" name="" id="websiteTags" placeholder="Bookmark tags, comma separated">
        <button onclick="addBookmark()">Add Bookmark</button>
    </div>

    <div>
        <input type="text" name="" id="searchInput">
    </div>

    <div>
        <label for="">Sort By</label>
        <select name="" id="sortBy">
            <option value="recent">Recently added</option>
            <option value="az">Title A-Z</option>
            <option value="za">Title Z-A</option>
        </select>
    </div>

    <div>
        <label for="">Filter by tag:</label>
        <select name="" id="filterByTag">
        </select>
    </div>

    <div id="bookmarksList">
        <div class="card">
            <p class="title">Title</p>
            <p class="url"><a href="https://google.com/">https://google.com/</a></p>
            <button onclick="editBookmark()">Edit</button>
        </div>
        <div class="card">
            <p class="title">Title</p>
            <p class="url"><a href="https://google.com/">https://google.com/</a></p>
        </div>
    </div>

    <div>
        <button id="themeSwitch">
            <span class="dark">🌙 / Dark</span>
            <span class="light">☀️ / Light</span>
        </button>
    </div>

    <div id="test"></div>
</body>
</html>
